# 無料プランの Supabase は7日間使われないと一時停止するので、定期的に軽く呼ぶ。
# 呼び出し先は、リポジトリの Actions の変数 SUPABASE_URL と SUPABASE_PUBLISHABLE_KEY に入れる。
name: Keep Supabase awake

on:
  schedule:
    # 3日ごと（日本時間の9時ごろ）
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::呼び出し先の変数が未設定のため、何もしません"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 --retry 3 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' -d '{}'
